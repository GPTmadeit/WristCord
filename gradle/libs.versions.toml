[versions]
agp = "9.1.0"
kotlin = "2.4.10"

compileSdk = "37"
targetSdk = "36"
minSdkMobile = "31"
minSdkWear = "33"

composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.17.0"
lifecycle = "2.10.0"
coroutines = "1.11.0"

playServicesWearable = "20.0.1"

wearCompose = "1.7.0-beta01"
wearToolingPreview = "1.0.0"
wear = "1.4.0"
wearOngoing = "1.1.0"
watchfaceComplications = "1.3.0"
protolayout = "1.4.2"
tiles = "1.6.2"
guava = "33.4.8-android"

okhttp = "5.5.1"
serializationJson = "1.12.0"
collectionsImmutable = "0.5.2"
coil = "3.6.3"
zxing = "3.5.4"
wearInput = "1.2.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version = "1.7.8" }

coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }

play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
